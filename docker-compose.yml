version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: almasa_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-almasa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-almasa_password}
      POSTGRES_DB: ${POSTGRES_DB:-almasa_jewelry}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
